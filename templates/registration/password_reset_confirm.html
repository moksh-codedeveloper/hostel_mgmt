{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width:400px; margin:auto; margin-top:50px;">
    <h2>Set New Password</h2>
    <hr>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="width:100%;">Reset Password</button>
    </form>
</div>
{% endblock %}
