{% extends "base.html" %}
{% block title %}Logged Out | HMS{% endblock %}
{% block content %}

<style>
  .logout-wrap {
    max-width: 400px;
    margin: 80px auto;
    text-align: center;
  }

  .logout-icon {
    width: 56px;
    height: 56px;
    background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin: 0 auto 20px;
  }

  .logout-wrap h2 {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #e2e8f0;
    margin-bottom: 8px;
  }

  .logout-wrap p {
    font-size: 13.5px;
    color: #475569;
    margin-bottom: 28px;
  }

  .btn-login {
    display: inline-block;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    padding: 11px 32px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: opacity 0.15s, transform 0.1s;
    box-shadow: 0 4px 14px rgba(59,130,246,0.3);
  }

  .btn-login:hover { opacity: 0.88; transform: translateY(-1px); }
</style>

<div class="logout-wrap">
  <div class="logout-icon">👋</div>
  <h2>You're logged out</h2>
  <p>You have successfully logged out of HMS. See you next time!</p>
  <a href="{% url 'login' %}" class="btn-login">Login Again →</a>
</div>

{% endblock %}
