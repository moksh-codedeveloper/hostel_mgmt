{% extends "base.html" %}

{% block title %}Reset Password | HMS{% endblock %}

{% block content %}
<div class="card" style="max-width:420px; margin:60px auto;">

    <h2 style="text-align:center;">Reset Password</h2>
    <p style="text-align:center; color:var(--muted); margin-bottom:20px;">
        Enter your email to receive a reset link
    </p>

    {% if form.errors %}
        <div class="alert">
            {{ form.errors }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Email Address</label>
        {{ form.email }}

        <button type="submit" style="width:100%; margin-top:10px;">
            Send Reset Link
        </button>
    </form>

</div>
{% endblock %}
