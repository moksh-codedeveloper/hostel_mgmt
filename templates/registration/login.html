{% extends "base.html" %}
{% block title %}Login | HMS{% endblock %}
{% block content %}

<style>
  .auth-wrap {
    max-width: 420px;
    margin: 56px auto;
  }

  .auth-header {
    text-align: center;
    margin-bottom: 24px;
  }

  .auth-icon {
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, #3b82f6, #1e40af);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin: 0 auto 14px;
    box-shadow: 0 0 18px rgba(59,130,246,0.35);
  }

  .auth-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #e2e8f0;
    margin-bottom: 5px;
  }

  .auth-header p { font-size: 13px; color: #475569; }

  .card {
    background: #101828;
    border: 1px solid #1c2d42;
    border-radius: 12px;
    padding: 28px 26px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: #94a3b8;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }

  .field input {
    width: 100%;
    background: #0c1220;
    color: #e2e8f0;
    border: 1px solid #1c2d42;
    border-radius: 8px;
    padding: 10px 13px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
  }

  .field input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }

  .btn-submit {
    width: 100%;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity 0.15s, transform 0.1s;
    box-shadow: 0 4px 14px rgba(59,130,246,0.3);
  }

  .btn-submit:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-submit:active { transform: translateY(0); }

  .alert-error {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.3);
    color: #f87171;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
  }

  .auth-footer {
    text-align: center;
    margin-top: 18px;
    font-size: 13.5px;
    color: #475569;
  }

  .auth-footer a {
    color: #3b82f6;
    font-weight: 500;
    text-decoration: none;
  }

  .auth-footer a:hover { color: #93c5fd; }
</style>

<div class="auth-wrap">
  <div class="auth-header">
    <div class="auth-icon">🔑</div>
    <h2>Welcome Back</h2>
    <p>Login to your HMS account</p>
  </div>

  <div class="card">
    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter your username" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="btn-submit">Login →</button>
    </form>
  </div>

  <p class="auth-footer">
    Don't have an account? <a href="{% url 'register' %}">Register</a>
  </p>
</div>

{% endblock %}
