{% extends "base.html" %}

{% block title %}Update Account | HMS{% endblock %}

{% block content %}
<div class="card" style="max-width:520px; margin:60px auto;">

    <h2 style="text-align:center; margin-bottom:5px;">Update Account</h2>
    <p style="text-align:center; color:var(--muted); margin-bottom:20px;">
        Update your basic account details
    </p>

    {% if error %}
        <div class="alert">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" value="{{ request.user.username }}" required>

        <label>Full Name</label>
        <input type="text" name="full_name" value="{{ request.user.full_name }}" required>

        <button type="submit" style="width:100%; margin-top:10px;">
            Save Changes
        </button>
    </form>

</div>
{% endblock %}
