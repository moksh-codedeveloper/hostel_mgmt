{% extends "base.html" %}

{% block title %}Update Student Profile | HMS{% endblock %}

{% block content %}
<div class="card" style="max-width:500px; margin:auto; margin-top:40px;">

    <h2 style="text-align:center;">Update Student Profile</h2>
    <hr>

    <form method="POST">
        {% csrf_token %}

        <label>Email</label>
        <input type="email" name="email" value="{{ student.email }}" required>

        <label>Phone Number</label>
        <input type="text" name="phone_number" value="{{ student.phone_number }}" required>

        <label>Semester</label>
        <input type="number" name="semester" value="{{ student.semester }}" required>

        <label>Gender</label>
        <select name="gender" required>
            <option value="male" {% if student.gender == "male" %}selected{% endif %}>Male</option>
            <option value="female" {% if student.gender == "female" %}selected{% endif %}>Female</option>
            <option value="other" {% if student.gender == "other" %}selected{% endif %}>Other</option>
        </select>

        <label>College</label>
        <input type="text" name="college" value="{{ student.college }}" required>

        <button type="submit" style="width:100%; margin-top:10px;">Update</button>
    </form>

    {% if error %}
        <p style="color:red; margin-top:10px;">{{ error }}</p>
    {% endif %}

</div>
{% endblock %}
