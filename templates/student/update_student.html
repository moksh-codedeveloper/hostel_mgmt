{% extends "base.html" %}

{% block title %}Update Student Profile | HMS{% endblock %}

{% block content %}
<div class="card" style="max-width:520px; margin:60px auto;">

    <h2 style="text-align:center; margin-bottom:5px;">Update Student Profile</h2>
    <p style="text-align:center; color:var(--muted); margin-bottom:20px;">
        Keep your information up to date
    </p>

    {% if error %}
        <div class="alert">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Email</label>
        <input type="email" name="email" value="{{ student.email }}" required>

        <label>Phone Number</label>
        <input type="text" name="phone_number" value="{{ student.phone_number }}" required>

        <label>Semester</label>
        <input type="number" name="semester" value="{{ student.semester }}" required>

        <label>Gender</label>
        <select name="gender" required>
            <option value="male" {% if student.gender == "male" %}selected{% endif %}>Male</option>
            <option value="female" {% if student.gender == "female" %}selected{% endif %}>Female</option>
            <option value="other" {% if student.gender == "other" %}selected{% endif %}>Other</option>
        </select>

        <label>College</label>
        <input type="text" name="college" value="{{ student.college }}" required>

        <button type="submit" style="width:100%; margin-top:10px;">
            Save Changes
        </button>
    </form>

</div>
{% endblock %}
