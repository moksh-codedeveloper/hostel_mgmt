{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hostel Management System{% endblock %}</title>

    <!-- Simple modern styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
        }

        header {
            background-color: #1f2937;
            color: white;
            padding: 15px 30px;
        }

        header h1 {
            margin: 0;
        }

        nav {
            background-color: #374151;
            padding: 10px 30px;
        }

        nav a {
            color: white;
            margin-right: 15px;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            padding: 30px;
            min-height: 80vh;
        }

        footer {
            background-color: #e5e7eb;
            padding: 10px 30px;
            font-size: 14px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        button {
            padding: 8px 14px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<header>
    <h1>Hostel Management System</h1>
</header>

{% if user.is_authenticated %}
<nav>
    <a href="{% url 'dashboard' %}">Dashboard</a>
    <a href="{% url 'student_profile' %}">Profile</a>
    <a href="{% url 'complaints_list' %}">Complaints</a>
    <a href="{% url 'leave_list' %}">Leaves</a>
    <a href="{% url 'fees_list' %}">Fees</a>

    <span style="float:right;">
        {{ user.username }} |
        <form method="POST" action="{% url 'user_logout' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    </span>
</nav>
{% endif %}

<main>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</main>

<footer>
    <p>© HMS</p>
</footer>

</body>
</html>
