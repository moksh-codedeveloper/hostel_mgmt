{% extends "admin/base.html" %}

{% block title %}{{ title }} | Hostel Control{% endblock %}

{% block branding %}
<div style="display:flex; align-items:center; justify-content:space-between; width:100%;">
  <div style="display:flex; align-items:center; gap:10px;">
    <div style="
      width:34px; height:34px;
      background:linear-gradient(135deg,#3b82f6,#1e40af);
      border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      font-size:17px;
      box-shadow:0 0 14px rgba(59,130,246,0.4);
      flex-shrink:0;
    ">🏨</div>
    <div>
      <div style="font-family:'Syne',sans-serif; font-weight:700; font-size:15px; color:#e2e8f0; letter-spacing:0.01em;">
        Hostel Control Panel
      </div>
      <div style="font-size:11px; color:#475569; letter-spacing:0.03em;">
        Admin Dashboard
      </div>
    </div>
  </div>
  <div style="
    display:flex; align-items:center; gap:6px;
    background:#162030; border:1px solid #1c2d42;
    padding:4px 12px; border-radius:99px;
    font-size:12px; color:#475569;
  ">
    <span style="
      width:7px; height:7px; background:#10b981;
      border-radius:50%; display:inline-block;
      box-shadow:0 0 6px #10b981;
    "></span>
    System Online
  </div>
</div>
{% endblock %}
