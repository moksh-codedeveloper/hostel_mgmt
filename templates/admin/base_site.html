{% extends "admin/base.html" %}

{% block title %}Hostel Control Panel{% endblock %}

{% block branding %}
<style>
    /* Override Django admin's default header */
    #header {
        background: var(--bg-surface, #0d1321);
        border-bottom: 1px solid var(--border, #1e2d45);
        padding: 0 28px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    #branding h1,
    #branding h1 a,
    #branding h1 a:link,
    #branding h1 a:visited {
        font-family: 'Syne', sans-serif;
        font-size: 18px;
        font-weight: 800;
        color: #e2e8f0;
        text-decoration: none;
        letter-spacing: -0.3px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* Navbar user tools strip */
    #user-tools {
        font-size: 13px;
        color: #94a3b8;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    #user-tools a {
        color: #3b82f6;
        text-decoration: none;
        padding: 5px 12px;
        border: 1px solid #1e2d45;
        border-radius: 6px;
        transition: all 0.2s;
        font-size: 12.5px;
        font-weight: 500;
    }

    #user-tools a:hover {
        background: rgba(59,130,246,0.1);
        border-color: rgba(59,130,246,0.4);
    }

    /* Django admin nav sidebar */
    #nav-sidebar {
        background: #0d1321;
        border-right: 1px solid #1e2d45;
    }

    #nav-sidebar .current-app .section:link,
    #nav-sidebar .current-app .section:visited {
        color: #3b82f6;
    }

    .toggle-nav-sidebar {
        color: #475569;
        border-color: #1e2d45;
    }

    /* Admin index app header */
    #content h1 {
        font-family: 'Syne', sans-serif;
        font-size: 22px;
        font-weight: 800;
        color: #e2e8f0;
        margin-bottom: 24px;
        letter-spacing: -0.5px;
    }

    .app-index h2, .app-index caption {
        font-family: 'Syne', sans-serif;
    }

    /* Status pill on header */
    .hostel-status-pill {
        font-size: 11px;
        font-weight: 600;
        background: rgba(16,185,129,0.1);
        color: #34d399;
        border: 1px solid rgba(16,185,129,0.25);
        padding: 3px 10px;
        border-radius: 20px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }
</style>

<div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
    <h1 id="site-name" style="margin:0; font-size:19px; font-family:'Syne',sans-serif; font-weight:800; color:#e2e8f0; display:flex; align-items:center; gap:10px;">
        🏨 Hostel Control Panel
    </h1>
    <div style="display:flex; align-items:center; gap:12px;">
        <span style="font-size:11px; color:#94a3b8; font-family:'DM Sans',sans-serif; letter-spacing:0.3px;">
            Admin Dashboard
        </span>
        <span class="hostel-status-pill">● Live</span>
    </div>
</div>
{% endblock %}
