{% extends "admin/base_site.html" %}

{% block title %}Admin Login | Hostel Control{% endblock %}

{% block content %}
<style>
  .login-wrap {
    min-height: calc(100vh - 140px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .login-card {
    width: 100%;
    max-width: 380px;
    background: #101828;
    border: 1px solid #1c2d42;
    border-radius: 14px;
    padding: 32px 28px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  .login-header {
    text-align: center;
    margin-bottom: 28px;
  }

  .login-icon {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, #3b82f6, #1e40af);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin: 0 auto 14px;
    box-shadow: 0 0 20px rgba(59,130,246,0.35);
  }

  .login-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: #e2e8f0;
    margin-bottom: 4px;
  }

  .login-sub {
    font-size: 12.5px;
    color: #475569;
  }

  .login-field {
    margin-bottom: 16px;
  }

  .login-field label {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: #94a3b8;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }

  .login-field input {
    width: 100%;
    background: #0c1220;
    color: #e2e8f0;
    border: 1px solid #1c2d42;
    border-radius: 8px;
    padding: 10px 13px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
  }

  .login-field input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }

  .login-btn {
    width: 100%;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: 0.02em;
  }

  .login-btn:hover {
    opacity: 0.9;
    transform: translateY(-1px);
  }

  .login-btn:active {
    transform: translateY(0);
  }

  .errornote {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.3);
    color: #f87171;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .errornote::before { content: "⚠️"; font-size: 14px; }
</style>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <div class="login-icon">🔐</div>
      <div class="login-title">Admin Login</div>
      <div class="login-sub">Hostel Control Panel</div>
    </div>

    {% if form.errors %}
    <div class="errornote">Invalid username or password</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="login-field">
        <label for="id_username">Username</label>
        {{ form.username }}
      </div>
      <div class="login-field">
        <label for="id_password">Password</label>
        {{ form.password }}
      </div>
      <input type="hidden" name="next" value="{{ next }}" />
      <button type="submit" class="login-btn">Sign In →</button>
    </form>
  </div>
</div>
{% endblock %}
