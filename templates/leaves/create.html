{% extends "base.html" %}
{% block title %}Apply Leave | HMS{% endblock %}
{% block content %}

<style>
  .form-wrap {
    max-width: 520px;
    margin: 48px auto;
  }

  .form-header {
    text-align: center;
    margin-bottom: 24px;
  }

  .form-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #e2e8f0;
    margin-bottom: 6px;
  }

  .form-header p { font-size: 13px; color: #475569; }

  .card {
    background: #101828;
    border: 1px solid #1c2d42;
    border-radius: 12px;
    padding: 28px 26px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: #94a3b8;
    margin-bottom: 6px;
    letter-spacing: 0.02em;
  }

  .field input,
  .field textarea {
    width: 100%;
    background: #0c1220;
    color: #e2e8f0;
    border: 1px solid #1c2d42;
    border-radius: 8px;
    padding: 10px 13px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
    resize: vertical;
  }

  .field input:focus,
  .field textarea:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }

  /* date picker icon color fix */
  .field input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(0.6);
    cursor: pointer;
  }

  .date-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .btn-submit {
    width: 100%;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity 0.15s, transform 0.1s;
    box-shadow: 0 4px 14px rgba(59,130,246,0.3);
  }

  .btn-submit:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-submit:active { transform: translateY(0); }

  .alert-error {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.3);
    color: #f87171;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }

  .alert-success {
    background: rgba(16,185,129,0.08);
    border: 1px solid rgba(16,185,129,0.3);
    color: #34d399;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 16px;
    font-size: 13px;
    color: #475569;
    text-decoration: none;
    transition: color 0.15s;
  }

  .back-link:hover { color: #3b82f6; }
</style>

<div class="form-wrap">
  <a href="/leaves/all/" class="back-link">← Back to Leaves</a>

  <div class="form-header">
    <h2>📅 Apply for Leave</h2>
    <p>Fill in the details for your leave request</p>
  </div>

  <div class="card">
    <div class="alert-error"  id="errorBox"></div>
    <div class="alert-success" id="successBox"></div>

    <form id="leaveForm">
      {% csrf_token %}

      <div class="field">
        <label>Reason</label>
        <textarea id="reason" rows="3" placeholder="Reason for leave..." required></textarea>
      </div>

      <div class="field">
        <label>Place on Leave</label>
        <input type="text" id="place_on_leave" placeholder="e.g. Mumbai, Home" required />
      </div>

      <div class="date-row">
        <div class="field">
          <label>Date of Leave</label>
          <input type="date" id="date_to_leave" required />
        </div>
        <div class="field">
          <label>Date of Return</label>
          <input type="date" id="date_of_return" required />
        </div>
      </div>

      <button type="submit" class="btn-submit">Submit Request →</button>
    </form>
  </div>
</div>

<script>
  document.getElementById("leaveForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const errorBox   = document.getElementById("errorBox");
    const successBox = document.getElementById("successBox");
    errorBox.style.display   = "none";
    successBox.style.display = "none";

    const data = {
      reason:         document.getElementById("reason").value,
      place_on_leave: document.getElementById("place_on_leave").value,
      date_to_leave:  document.getElementById("date_to_leave").value,
      date_of_return: document.getElementById("date_of_return").value,
    };

    fetch("/leaves/create/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value
      },
      body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(data => {
      if (data.errors) {
        errorBox.style.display = "block";
        errorBox.textContent = Object.values(data.errors).flat().join(", ");
      } else {
        successBox.style.display = "block";
        successBox.textContent = "✅ Leave request submitted successfully!";
        document.getElementById("leaveForm").reset();
      }
    })
    .catch(() => {
      errorBox.style.display = "block";
      errorBox.textContent = "Something went wrong. Please try again.";
    });
  });
</script>

{% endblock %}
