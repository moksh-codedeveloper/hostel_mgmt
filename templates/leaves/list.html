{% extends "base.html" %}
{% block title %}Leaves | HMS{% endblock %}
{% block content %}

<style>
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .page-header h2 {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #e2e8f0;
    margin-bottom: 4px;
  }

  .page-header p { font-size: 13px; color: #475569; }

  .btn-new {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    padding: 9px 18px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    transition: opacity 0.15s, transform 0.1s;
    box-shadow: 0 4px 14px rgba(59,130,246,0.3);
    white-space: nowrap;
  }

  .btn-new:hover { opacity: 0.88; transform: translateY(-1px); }

  .card {
    background: #101828;
    border: 1px solid #1c2d42;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .leaves-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }

  .leaves-table th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #475569;
    padding: 12px 16px;
    border-bottom: 1px solid #1c2d42;
    background: #0c1220;
  }

  .leaves-table td {
    padding: 13px 16px;
    color: #e2e8f0;
    border-bottom: 1px solid #1c2d42;
    vertical-align: middle;
  }

  .leaves-table tr:last-child td { border-bottom: none; }
  .leaves-table tr:hover td { background: #162030; }

  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
  }

  .badge-green  { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #10b981; }
  .badge-yellow { background: rgba(245,158,11,0.1);  border: 1px solid rgba(245,158,11,0.3); color: #f59e0b; }
  .badge-red    { background: rgba(239,68,68,0.1);   border: 1px solid rgba(239,68,68,0.3);  color: #ef4444; }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: #475569;
  }

  .empty-state span { display: block; font-size: 32px; margin-bottom: 10px; }
  .empty-state p { font-size: 13.5px; }
</style>

<div class="page-header">
  <div>
    <h2>📅 My Leaves</h2>
    <p>Track your leave requests and their status</p>
  </div>
  <a href="{% url 'create_leaves_page' %}" class="btn-new">+ New Leave</a>
</div>

<div class="card">
  <table class="leaves-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Reason</th>
        <th>Destination</th>
        <th>From</th>
        <th>To</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="leavesBody">
      <tr>
        <td colspan="6">
          <div class="empty-state"><span>⏳</span><p>Loading leaves...</p></div>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<script>
  fetch("/leaves/all/api/")
    .then(res => res.json())
    .then(data => {
      const tbody = document.getElementById("leavesBody");

      if (!data.leaves || data.leaves.length === 0) {
        tbody.innerHTML = `
          <tr><td colspan="6">
            <div class="empty-state"><span>📭</span><p>No leave requests yet</p></div>
          </td></tr>`;
        return;
      }

      tbody.innerHTML = "";
      data.leaves.forEach(l => {
        tbody.innerHTML += `
          <tr>
            <td style="color:#475569; font-size:12px;">#${l.id}</td>
            <td>${l.reason}</td>
            <td style="color:#94a3b8;">${l.place_on_leave ?? "—"}</td>
            <td style="color:#94a3b8;">${l.from}</td>
            <td style="color:#94a3b8;">${l.to}</td>
            <td>${statusBadge(l.status)}</td>
          </tr>`;
      });
    })
    .catch(() => {
      document.getElementById("leavesBody").innerHTML = `
        <tr><td colspan="6">
          <div class="empty-state"><span>⚠️</span><p>Failed to load leaves</p></div>
        </td></tr>`;
    });

  function statusBadge(status) {
    if (status === "A") return `<span class="badge badge-green">Approved</span>`;
    if (status === "P") return `<span class="badge badge-yellow">Pending</span>`;
    if (status === "R") return `<span class="badge badge-red">Rejected</span>`;
    return `<span class="badge">${status}</span>`;
  }
</script>

{% endblock %}
